name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads an Android framework jar on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-
      - name: Engine unit tests
        run: ./gradlew :core:test
      - name: Keyboard view tests (Robolectric)
        # one retry: the first run may fail on a transient download of the Android jar
        run: ./gradlew :app:testDebugUnitTest || (sleep 15 && ./gradlew :app:testDebugUnitTest)
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: amharic-keyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
