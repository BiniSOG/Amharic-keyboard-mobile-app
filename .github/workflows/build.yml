name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads an Android framework jar on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-
      # Production signing key, if configured (see app/signing/README.md); otherwise the
      # committed test key is used.
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Engine unit tests
        run: ./gradlew :core:test
      - name: Keyboard view tests (Robolectric)
        # one retry: the first run may fail on a transient download of the Android jar
        run: ./gradlew :app:testDebugUnitTest || (sleep 15 && ./gradlew :app:testDebugUnitTest)
      - name: Build release APK and Play Store bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease
      - name: Lint
        run: ./gradlew :app:lintRelease
      - name: Size report
        run: |
          ls -l app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
          echo "### APK size: $(du -h app/build/outputs/apk/release/*.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: amharic-keyboard-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: amharic-keyboard-play-bundle
          path: app/build/outputs/bundle/release/*.aab
